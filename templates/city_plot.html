<!DOCTYPE html>
<html>
<head>
  <title>Combined LST Dashboard</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.sync"></script>   <!-- map sync -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html,body{margin:0;padding:0;font-family:sans-serif}
    .section{border:1px solid #ccc;padding:10px;border-radius:8px;margin:10px auto;
             max-width:1000px;background:#f9f9f9}
    #mapRow{display:flex;gap:8px;height:65vh}
    #mapMay,#mapJun{flex:1}
    #map2{height:65vh;width:100%}
    canvas{width:100%!important;height:100%!important}
    .legend-box{background:#fff;padding:6px 8px;font-size:12px;border-radius:4px;
                box-shadow:0 0 4px rgba(0,0,0,.2);line-height:1.1;display:flex;
                align-items:center;gap:6px;user-select:none}
  </style>
</head>
<body>

<!-- 1️⃣  SIDE‑BY‑SIDE JAN/APR MAPS -->
<div class="section" id="mapContainer">
  <h2>🌍 LST</h2>

  <div id="mapRow">
    <div id="mapMay"></div>
    <div id="mapJun"></div>
  </div>
  <p style="text-align:center;margin:6px 0 0 0;">
  <b>City‑wide average:</b>
  <span id="avgMay">–</span> °C (<span id="labelMay">–</span>) | 
  <span id="avgJun">–</span> °C (<span id="labelJun">–</span>)
</p>
</div>

<!-- 2️⃣  WARD‑WISE MAP + BAR CHART -->
<div class="section" id="wardChartMapContainer">
  <h2>🗘 Ward‑wise LST Map & Top‑10 Hottest Wards</h2>

  <div id="map2"></div>
  <div style="margin-top:6px">
    <label for="wardSlider"><b>Month:</b> 
      <span id="wardMonthLabel">May</span>
    </label>
    <input type="range" id="wardSlider" min="0" max="1" step="1">
  </div>
  <canvas id="barChart"></canvas>
</div>

<!-- 3️⃣  MONTHLY TIME‑SERIES LINE CHART -->
<!-- <div class="section" id="lineChartContainer">
  <h2>📈 Monthly Average LST (2000 – 2024)</h2>
  <canvas id="lstChart"></canvas>
</div> -->
<div class="section" id="yearlyLineChartContainer">
  <h2>📈 Yearly Avg LST </h2>
  <canvas id="yearlyLineChart"></canvas>
</div>

<script>
/* ------------------- GLOBAL CITY & CENTER ------------------- */
const CITY = "{{ CITY }}";
const MONTH1 = "{{ MONTH1 }}";   // e.g. "May"
const YEAR1 = "{{ YEAR1 }}";     // e.g. 2025
const MONTH2 = "{{ MONTH2 }}";   // e.g. "June"
const YEAR2 = "{{ YEAR2 }}";     // e.g. 2025

document.getElementById("labelMay").textContent = MONTH1;
document.getElementById("labelJun").textContent = MONTH2;

function monthToNum(month) {
  return new Date(Date.parse(month + " 1, 2020")).getMonth() + 1;
}

let dimm;
switch (CITY.toUpperCase()) {
  case "MUMBAI":    dimm = [19.0760, 72.8777]; break;
  case "BANGALORE": dimm = [12.9716, 77.5946]; break;
  case "DELHI":     dimm = [28.6139, 77.2090]; break;
  case "AHMEDABAD":     dimm = [23.0339, 72.5850]; break;
  default:          dimm = [20.5937, 78.9629];
}

/* ------------------- 1) SIDE‑BY‑SIDE MAPS ------------------- */
const monthDefs = [
  { label: MONTH1, file: `${String(monthToNum(MONTH1)).padStart(2, '0')}.json`, div: "mapMay", avgSpan: "avgMay" },
  { label: MONTH2, file: `${String(monthToNum(MONTH2)).padStart(2, '0')}.json`, div: "mapJun", avgSpan: "avgJun" }
];

function addBase(m) {
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(m);
}

Promise.all(
  monthDefs.map(m =>
    fetch(`/static/data_json/${CITY}/lst_layer/${YEAR1}/${m.file}`)
      .then(r => r.json()).then(j => ({ meta: m, json: j }))
)).then(res => {
  const maps = [];
  res.forEach(({ meta, json }) => {
    const mp = L.map(meta.div).setView(dimm, 10.5); addBase(mp);
    L.layerGroup([
      L.tileLayer(json.tile_url, { opacity: .7, attribution: "LST" }),
      L.tileLayer(json.cloud_tile_url, { opacity: 0.5 })
    ]).addTo(mp);
    document.getElementById(meta.avgSpan).textContent =
      json.avg_value.toFixed(2);
    maps.push(mp);
  });
  if (L.Map.prototype.sync) {
    maps[0].sync(maps[1]);
    maps[1].sync(maps[0]);
  }
});

/* ------------------- 2) WARD MAP + BAR CHART ---------------- */
const wardMonths = [`${MONTH1}-${YEAR1}`, `${MONTH2}-${YEAR2}`];
const wardSlider = document.getElementById("wardSlider");
const wardLabel = document.getElementById("wardMonthLabel");
const map2 = L.map('map2').setView(dimm, 10.5); addBase(map2);
let geoLayer = null, barChart = null, legend = null;
const ward_code_to_name = {
  "A": "Colaba", "B": "Sandhurst Road", "C": "Marine Lines", "D": "Girgaon",
  "E": "Byculla", "F/S": "Parel", "F/N": "Mahim", "G/S": "Dadar West", "G/N": "Bandra",
  "H/E": "Santacruz East", "H/W": "Andheri West", "K/E": "Andheri East",
  "K/W": "Goregaon", "L": "Kurla", "M/E": "Chembur East", "M/W": "Chembur West",
  "N": "Ghatkopar", "S": "Bhandup", "T": "Mulund", "P/S": "Malad East", "P/N": "Borivali",
  "R/S": "Borivali East", "R/C": "Borivali North", "R/N": "Dahisar"
};

function loadWardMonth(idx) {
  const mStr = wardMonths[idx];
  wardLabel.textContent = `${mStr.split("-")[0]} ${mStr.split("-")[1]}`;

  fetch(`/static/data_json/${CITY}/${mStr}/ward_geojson.json`)
    .then(r => r.json()).then(geo => {
      if (geoLayer) map2.removeLayer(geoLayer);
      if (legend) map2.removeControl(legend);

      const min = Math.min(...geo.features.map(f => f.properties.avg_LST));
      const max = Math.max(...geo.features.map(f => f.properties.avg_LST));
      const getColor = v => {
        const r = (v - min) / (max - min);
        return `rgb(${Math.round(255 * r)},0,${Math.round(255 * (1 - r))})`;
      };

      legend = L.control({ position: 'bottomright' });
      legend.onAdd = () => {
        const d = L.DomUtil.create('div', 'legend-box');
        const bar = document.createElement('div');
        bar.style = `width:18px;height:140px;background:linear-gradient(to top,blue,red);border:1px solid #ccc`;
        const lab = document.createElement('div');
        lab.style = `display:flex;flex-direction:column;justify-content:space-between;height:140px`;
        lab.innerHTML = `<span>${max.toFixed(1)}°C</span><span>${((max + min) / 2).toFixed(1)}°C</span><span>${min.toFixed(1)}°C</span>`;
        d.appendChild(bar); d.appendChild(lab);
        L.DomEvent.disableClickPropagation(d);
        return d;
      };
      legend.addTo(map2);

      geoLayer = L.geoJSON(geo, {
        style: f => f.properties.cloud_cover === 1 ? {
          fillColor: '#888888', fillOpacity: 0.2, color: '#555', weight: 1, dashArray: '2,4'
        } : {
          fillColor: getColor(f.properties.avg_LST), fillOpacity: 0.6, color: '#000', weight: 1
        },
        onEachFeature: (f, l) => {
          let wardName;
          if (CITY.toUpperCase() === "MUMBAI") {
            wardName = ward_code_to_name[f.properties.Name] || f.properties.Name;
          } else if (CITY.toUpperCase() === "BANGALORE") {
            wardName = f.properties.KGISWardNa;
          } else {
            wardName = f.properties.name || f.properties.Name || "Ward";
          }
          const tooltipContent = f.properties.cloud_cover === 1
            ? `<b>${wardName}</b><br>⚠️ Data not available (cloud cover)`
            : `<b>${wardName}</b><br>LST: ${f.properties.avg_LST.toFixed(2)} °C`;

          l.bindTooltip(tooltipContent, { direction: 'top', sticky: true, opacity: 0.9 });

          l.on({
            mouseover: e => e.target.setStyle({ weight: 2, color: '#333', fillOpacity: 0.9 }),
            mouseout: e => geoLayer.resetStyle(e.target)
          });

          // const html = `<b>${wardName}</b><br>LST: ${f.properties.avg_LST.toFixed(2)} °C`;
          // l.bindTooltip(html, { direction: 'top', sticky: true, opacity: 0.9 });
          // l.on({
          //   mouseover: e => e.target.setStyle({ weight: 2, color: '#333', fillOpacity: 0.9 }),
          //   mouseout: e => geoLayer.resetStyle(e.target)
          // });
        }
      }).addTo(map2);
    });

  fetch(`/static/data_json/${CITY}/${mStr}/top10_lst_data.json`)
    .then(r => r.json()).then(data => {
      const ctx = document.getElementById('barChart').getContext('2d');
      const labels = data.map(d => CITY.toUpperCase() === "MUMBAI" ?
        ward_code_to_name[d.ward] : d.ward);
      const values = data.map(d => d.lst);
      if (barChart) {
        barChart.data.labels = labels;
        barChart.data.datasets[0].data = values;
        barChart.options.plugins.title.text = `Top 10 Hottest Wards – ${mStr}`;
        barChart.update();
      } else {
        barChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{ label: 'Avg LST (°C)', data: values, backgroundColor: 'rgba(255,99,132,.6)' }]
          },
          options: {
            responsive: true, indexAxis: 'y',
            plugins: { title: { display: true, text: `Top 10 Hottest Wards – ${mStr}` }, legend: { display: false } },
            scales: {
              x: { title: { display: true, text: 'Avg LST (°C)' }, min: 20 },
              y: { title: { display: true, text: 'Ward' } }
            }
          }
        });
      }
    });
}

wardSlider.addEventListener('input', e => loadWardMonth(+e.target.value));
loadWardMonth(0);

/* ------------------- 3) MONTHLY LINE CHART ------------------ */
const currentYear = new Date().getFullYear()-1;
const years = Array.from({length: currentYear - 1981}, (_, i) => 1980 + i);
const ctxLine = document.getElementById("yearlyLineChart").getContext("2d");

Promise.all(
  years.map(y =>
    fetch(`/static/data_json/${CITY}/yearly_avg_era5_M/${y}.json`)
      .then(r => r.ok ? r.json() : {[y]: null})
      .catch(() => ({[y]: null}))
  )
).then(dataList => {
  const temps = dataList.map(d => {
    const key = Object.keys(d)[0];
    return d[key];
  });

  // Filter out nulls for regression
  const validYears = [];
  const validTemps = [];
  for (let i = 0; i < years.length; i++) {
    if (temps[i] != null) {
      validYears.push(years[i]);
      validTemps.push(temps[i]);
    }
  }

  // Simple linear regression (least squares)
  const n = validYears.length;
  const sumX = validYears.reduce((a, b) => a + b, 0);
  const sumY = validTemps.reduce((a, b) => a + b, 0);
  const sumXY = validYears.reduce((sum, x, i) => sum + x * validTemps[i], 0);
  const sumX2 = validYears.reduce((sum, x) => sum + x * x, 0);

  const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;

  const trendLine = years.map(x => slope * x + intercept);

  new Chart(ctxLine, {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        {
          label: 'Avg LST (°C)',
          data: temps,
          fill: false,
          borderColor: 'rgba(255, 99, 132, 1)',
          backgroundColor: 'rgba(255, 99, 132, 0.2)',
          tension: 0.3,
          spanGaps: true
        },
        {
          label: 'Trend Line',
          data: trendLine,
          borderColor: 'rgba(54, 162, 235, 1)',
          borderDash: [10, 5],
          fill: false,
          pointRadius: 0,
          tension: 0
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: false,
          min: 22,
          max: 26,
          title: { display: true, text: 'Temperature (°C)' }
        },
        x: {
          title: { display: true, text: 'Year' }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: ctx => ctx.raw === null ? 'No data' : ctx.raw.toFixed(2) + ' °C'
          }
        }
      }
    }
  });
});
